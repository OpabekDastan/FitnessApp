name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: echo "Test passed"

      
      - name: Check project folder
        run: |
          if [ -d "FitnessApp" ]; then
            echo "Project folder exists"
          else
            echo "Project folder is missing"
            exit 1
          fi

        
      - name: Check merge conflicts
        run: |
          if grep -RnE '^(<<<<<<< |=======|>>>>>>> )' FitnessApp; then
            echo "Possible merge conflict markers found"
            exit 1
          fi
          echo "No merge conflict markers found"

          
